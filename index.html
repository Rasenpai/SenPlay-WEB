<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- If you have an official favicon.png in /public, swap the line above for:
         <link rel="icon" type="image/png" href="/favicon.png" />
         <link rel="apple-touch-icon" href="/favicon.png" />
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (homepage defaults; overridden per-route by src/components/SEO.jsx for JS-executing crawlers) -->
    <title>SenPlay — Entertainment, in one place.</title>
    <meta
      name="description"
      content="Discover and enjoy anime, donghua, comics, movies, and more with SenPlay."
    />
    <meta name="robots" content="index, follow" />
    <!-- TODO: replace YOUR-DOMAIN.com with SenPlay's official production domain -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SenPlay" />
    <meta
      property="og:title"
      content="SenPlay — Entertainment, in one place."
    />
    <meta
      property="og:description"
      content="Discover and enjoy anime, donghua, comics, movies, and more with SenPlay."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <!-- Add the actual image file at /public/og-image.png -->
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SenPlay — Entertainment, in one place."
    />
    <meta
      name="twitter:description"
      content="Discover and enjoy anime, donghua, comics, movies, and more with SenPlay."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
